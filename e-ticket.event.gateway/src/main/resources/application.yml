server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      httpclient:
        connect-timeout: 1000
        response-timeout: 5m

      routes:
        # ✅ Rota para Auth Service
        - id: auth-service
          uri: lb://e-ticket.event.auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # ✅ Rota para Event Categories
        - id: event-service
          uri: lb://e-ticket.event.core
          predicates:
            - Path=/e-ticket/**
          filters:
            - StripPrefix=1

      # ✅ CORREÇÃO: Configuração correta do DedupeResponseHeader
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
        - DedupeResponseHeader=Access-Control-Allow-Credentials

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

# JWT Configuration
app:
  jwt:
    secret: "mySuperSecretKeyThatIsVeryLongAndSecureForJWTTokenGeneration123456"

# Logging Configuration
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG
        security: DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true