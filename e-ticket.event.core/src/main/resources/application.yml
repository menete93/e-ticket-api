server:
  port: 8080

feign:
  oauth:
    client-id: "meu-servico"
    client-secret: "segredo123"
    token-url: "http://localhost:8085/oauth2/token"

spring:
  application:
    name: e-ticket.event.core
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: default
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:e_ticket}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: e_ticket

  sql:
    init:
      mode: never
      platform: postgres
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
      preferIpAddress: true

# Configuração do executor para callbacks assíncronos
payment:
  async:
    callback-executor:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100
      thread-name-prefix: callback-

  reservation:
    sync-timeout-minutes: 30
    async-timeout-minutes: 2880
    max-attempts: 3

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type: TRACE
        orm:
          jdbc: DEBUG
      springframework:
        orm:
          jpa: DEBUG
        transaction: DEBUG
      postgresql: DEBUG
    com:
      zaxxer:
        hikari: DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

